name: GARRY V7 Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Deps & Fix SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          sudo apt update -qq
          sudo apt install -y build-essential libssl-dev libffi-dev python3-dev libbz2-dev libsqlite3-dev unzip
          pip install buildozer cython==0.29.36
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
          yes | sdkmanager --licenses || true
      - name: Build APK
        run: |
          rm -rf .buildozer
          rm -rf bin
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-APK
          path: bin/*.apk: 
