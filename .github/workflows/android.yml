name: GARRY V7 Android APK

on:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: garry-v7-android-build
cancel-in-progress: false

jobs:
test-and-build:
name: Validate Source and Build Debug APK
runs-on: ubuntu-22.04
timeout-minutes: 120

env:
  ANDROID_NDK_VERSION: 25.2.9519653
  ANDROID_API_LEVEL: "34"
  BUILD_TOOLS_VERSION: 34.0.0
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Verify required files
    shell: bash
    run: |
      set -euo pipefail

      test -f main.py
      test -f app/ui.py
      test -f app/login.py
      test -f app/state.py
      test -f data/market_feed.py
      test -f data/delta_public.py
      test -f strategy/__init__.py
      test -f strategy/backtest.py
      test -f buildozer.spec
      test -f requirements.txt

      echo "All required application files are present."

  - name: Check Python syntax
    shell: bash
    run: |
      set -euo pipefail
      python --version
      python -m compileall -q main.py app data strategy
      echo "Python syntax check passed."

  - name: Install test dependencies
    shell: bash
    run: |
      set -euo pipefail
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt

  - name: Run unit tests
    shell: bash
    run: |
      set -euo pipefail
      python -m unittest discover -s tests -p "test_*.py" -v

  - name: Verify backtesting imports
    shell: bash
    run: |
      set -euo pipefail
      python -c "from strategy.backtest import run_backtest; print('Backtesting import passed')"

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: platform-tools

  - name: Install Android SDK components
    shell: bash
    run: |
      set -euo pipefail

      yes | sdkmanager --licenses >/dev/null || true

      sdkmanager \
        "platform-tools" \
        "platforms;android-${ANDROID_API_LEVEL}" \
        "build-tools;${BUILD_TOOLS_VERSION}" \
        "ndk;${ANDROID_NDK_VERSION}"

  - name: Verify Android environment
    shell: bash
    run: |
      set -euo pipefail

      java -version
      python --version
      command -v sdkmanager

      test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
      test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
      test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

      echo "Android SDK and NDK verified."

  - name: Install Buildozer
    shell: bash
    run: |
      set -euo pipefail

      python -m pip install buildozer==1.6.0 cython==0.29.34 virtualenv
      buildozer --version
      cython --version

  - name: Show build configuration
    shell: bash
    run: |
      set -euo pipefail
      cat buildozer.spec
      echo "Build configuration displayed."

  - name: Build Android debug APK
    shell: bash
    run: |
      set -euo pipefail
      buildozer -v android debug

  - name: Verify APK
    shell: bash
    run: |
      set -euo pipefail

      test -d bin
      find bin -maxdepth 1 -type f -name "*.apk" -print -quit | grep -q .

      echo "APK generated successfully."
      ls -lh bin/*.apk

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: GARRY-V7-SMC-ICT-TRADING-BOT-debug
      path: bin/*.apk
      if-no-files-found: error
      retention-days: 14
