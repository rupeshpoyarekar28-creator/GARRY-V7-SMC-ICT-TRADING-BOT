name: GARRY V7 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Paper Trading and Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_API_LEVEL: 34
      BUILD_TOOLS_VERSION: 34.0.0
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 3. Verify Python and repository files
      - name: Verify project files
        shell: bash
        run: |
          set -e
          python --version
          test -f main.py
          test -f buildozer.spec
          test -f strategy/paper_trading.py
          test -f strategy/risk.py
          test -f tests/test_paper_trading.py
          echo "Required project files found."

      # 4. Run Paper Trading unit tests BEFORE building
      - name: Run Paper Trading Unit Tests
        shell: bash
        run: |
          set -e
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      # 5. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 7. Install Android SDK components
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      # 8. Verify build environment
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "========== PYTHON =========="
          python --version

          echo "========== JAVA =========="
          java -version

          echo "========== SDKMANAGER =========="
          command -v sdkmanager
          sdkmanager --version

          echo "========== ANDROID COMPONENTS =========="
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"

          echo "Android SDK components verified."

      # 9. Install Buildozer dependencies
      - name: Install Buildozer dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.34 \
            virtualenv

      # 10. Verify Buildozer
      - name: Verify Buildozer
        shell: bash
        run: |
          set -e
          buildozer --version
          cython --version

      # 11. Clean previous build output
      - name: Clean build output
        shell: bash
        run: |
          set -e
          rm -rf .buildozer
          rm -rf bin
          echo "Build output cleaned."

      # 12. Show build configuration
      - name: Show build configuration
        shell: bash
        run: |
          set -e
          echo "========== BUILDOZER CONFIG =========="
          cat buildozer.spec

          echo "========== REQUIREMENTS =========="
          if [ -f requirements.txt ]; then
            cat requirements.txt
          fi

      # 13. Build Android debug APK
      - name: Build Android debug APK
        shell: bash
        run: |
          set -e
          buildozer -v android debug

      # 14. Verify APK exists
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========== APK OUTPUT =========="
          ls -lah bin

          APK_COUNT=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -lt 1 ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      # 15. Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-SMC-ICT-TRADING-BOT-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
