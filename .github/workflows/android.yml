name: GARRY V7 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate Source and Build Debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_API_LEVEL: 34
      BUILD_TOOLS_VERSION: 34.0.0
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          python --version
          test -f main.py
          test -f app/ui.py
          test -f app/login.py
          test -f app/state.py
          test -f data/market_feed.py
          test -f data/delta_public.py
          test -f buildozer.spec
          test -f requirements.txt
          echo "Required application files found."

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py app data strategy
          echo "Python syntax check passed."

      - name: Run existing unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          command -v sdkmanager
          sdkmanager --version
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
          echo "Android SDK components verified."

      - name: Install Buildozer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.6.0 cython==0.29.34 virtualenv

      - name: Verify Buildozer
        shell: bash
        run: |
          set -euo pipefail
          buildozer --version
          cython --version

      - name: Clean previous build output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .buildozer bin

      - name: Show build configuration
        shell: bash
        run: |
          set -euo pipefail
          cat buildozer.spec
          echo "========== REQUIREMENTS =========="
          cat requirements.txt

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          buildozer -v android debug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -d bin
          ls -lah bin
          find bin -maxdepth 1 -type f -name "*.apk" -print -quit | grep -q .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-SMC-ICT-TRADING-BOT-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
