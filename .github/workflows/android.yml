name: GARRY V7 Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y build-essential libssl-dev libffi-dev python3-dev libbz2-dev
          pip install buildozer cython==0.29.36

      - name: FORCE Accept Android Licenses (Aidl Fix)
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea04e4bb" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          cp -r ~/.buildozer/android/platform/android-sdk/licenses/* ~/.android/licenses/ || true
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          rm -rf bin/
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-APK
          path: bin/*.apk
