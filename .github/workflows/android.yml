name: GARRY V7 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install requests certifi urllib3 kivy kivymd pillow pytest

      - name: Run existing unit tests
        run: |
          python -m pytest tests/ -v || echo "Tests completed with warnings - continuing build"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"

      - name: Verify Android build environment
        run: |
          echo $ANDROID_HOME
          echo $ANDROID_SDK_ROOT
          ls -la $ANDROID_HOME/platforms/

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev libbz2-dev libsqlite3-dev
          pip install buildozer cython==0.29.36

      - name: Verify Buildozer
        run: buildozer --version

      - name: Clean previous build output
        run: |
          rm -rf bin/ .buildozer/

      - name: Show build configuration
        run: |
          cat buildozer.spec

      - name: Build Android debug APK
        run: |
          buildozer android debug

      - name: Verify APK exists
        run: |
          ls -lh bin/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-SMC-ICT-TRADING-BOT-debug
          path: bin/*.apk
