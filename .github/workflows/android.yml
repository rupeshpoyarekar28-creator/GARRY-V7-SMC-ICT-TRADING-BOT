name: GARRY V7 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_API_LEVEL: 34
      BUILD_TOOLS_VERSION: 34.0.0

    steps:

      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Setup Python 3.11
      # ------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------------
      # 3. Setup Java 17
      # ------------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ------------------------------------------------------------
      # 4. Setup Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ------------------------------------------------------------
      # 5. Install Android SDK components
      # ------------------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "Installed Android SDK:"
          sdkmanager --list_installed | grep -E "platforms;android|build-tools|ndk;" || true


      # ------------------------------------------------------------
      # 6. Verify Java / Python / Android / NDK
      # ------------------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          echo "========== PYTHON =========="
          python --version

          echo "========== JAVA =========="
          java -version

          echo "========== ANDROID SDK =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "========== NDK =========="
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          ls -la "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" | head

          echo "========== BUILD TOOLS =========="
          ls -la "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}" | head


      # ------------------------------------------------------------
      # 7. Install Buildozer dependencies
      # ------------------------------------------------------------
      - name: Install Buildozer dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.34 \
            virtualenv


      # ------------------------------------------------------------
      # 8. Verify Buildozer
      # ------------------------------------------------------------
      - name: Verify Buildozer
        shell: bash
        run: |
          buildozer --version
          cython --version


      # ------------------------------------------------------------
      # 9. Clean previous build/cache
      # ------------------------------------------------------------
      - name: Clean Buildozer build
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Build directories cleaned."


      # ------------------------------------------------------------
      # 10. Check buildozer.spec
      # ------------------------------------------------------------
      - name: Show build configuration
        shell: bash
        run: |
          echo "========== buildozer.spec =========="
          cat buildozer.spec

          echo "========== requirements.txt =========="
          if [ -f requirements.txt ]; then
            cat requirements.txt
          else
            echo "requirements.txt not found"
          fi


      # ------------------------------------------------------------
      # 11. Build APK
      # ------------------------------------------------------------
      - name: Build Android debug APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          buildozer -v android debug


      # ------------------------------------------------------------
      # 12. Verify APK
      # ------------------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          echo "========== BIN DIRECTORY =========="
          ls -lah bin || true

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          find bin -maxdepth 1 -type f -name "*.apk" -print


      # ------------------------------------------------------------
      # 13. Upload APK
      # ------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GARRY-V7-SMC-ICT-TRADING-BOT-debug
          path: bin/*.apk
          if-no-files-found: error
